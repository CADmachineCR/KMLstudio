<!DOCTYPE html>
<html lang="en" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title id="seo-title">KML Studio - Create and View routes for Google Earth</title>
    <meta id="seo-desc" name="description" content="Convert your code to KML/KMZ format and preview it on an interactive map. Free online tool.">
    <meta name="keywords" content="create kml, kmz converter, kml viewer online, kml map preview, google earth">
    <meta name="robots" content="index, follow">

    <!-- 1. GOOGLE ANALYTICS 4 (GA4) - TRACKING -->
    <!-- Reemplaza 'G-XXXXXXXXXX' con tu ID de medición real de Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX'); // Pon tu ID aquí
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS (Para el mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-enter { animation: slideUp 0.3s ease-out forwards; }
        /* Ajuste para que el mapa no se superponga a otros elementos de Tailwind */
        #map { z-index: 10; } 
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow-md z-20 relative">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight" id="t-logo">KML Studio</h1>
                <p class="text-slate-400 text-xs mt-1" id="t-slogan">Generate & Preview KML/KMZ</p>
            </div>
            <select id="lang-selector" onchange="changeLanguage(this.value)" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2">
                <option value="en">🇺🇸 English</option>
                <option value="es">🇪🇸 Español</option>
                <option value="pt">🇧🇷 Português</option>
            </select>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full space-y-8">

        <!-- ESPACIO ADSENSE SUPERIOR -->
        <div class="w-full bg-slate-200 text-slate-400 text-sm py-4 flex justify-center items-center rounded border border-dashed border-slate-300">
            [AdSense Top Banner]
        </div>

        <!-- Sección Principal Dividida (Código a la izquierda, Mapa a la derecha) -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- Panel Izquierdo: Controles -->
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 p-6 space-y-5">
                <div>
                    <label for="kmlInput" class="block text-sm font-bold text-slate-700 mb-2" id="t-label-code">Paste your KML code here:</label>
                    <textarea id="kmlInput" rows="10" class="w-full p-4 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono text-sm text-slate-600 bg-slate-50" placeholder="<?xml version='1.0' encoding='UTF-8'?>..."></textarea>
                </div>

                <div>
                    <label for="fileName" class="block text-sm font-bold text-slate-700 mb-2" id="t-label-name">File name:</label>
                    <input type="text" id="fileName" value="MyRoute" class="w-full p-4 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 font-medium">
                </div>

                <div class="pt-2 flex flex-col gap-3">
                    <!-- Botón 1: Previsualizar en Mapa -->
                    <button onclick="previewOnMap()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl shadow transition-all flex justify-center items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
                        <span id="t-btn-preview">Preview on Map</span>
                    </button>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <!-- Botón 2: Descargar KML -->
                        <button onclick="generarArchivo('kml')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow transition-all flex justify-center items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                            <span>.KML</span>
                        </button>
                        
                        <!-- Botón 3: Descargar KMZ -->
                        <button onclick="generarArchivo('kmz')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow transition-all flex justify-center items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                            <span>.KMZ (Zip)</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Panel Derecho: Visor de Mapa -->
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 flex flex-col min-h-[400px]">
                <div class="bg-slate-100 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                    <span class="font-bold text-slate-700" id="t-map-title">Interactive Map Preview</span>
                </div>
                <!-- Contenedor del Mapa -->
                <div id="map" class="flex-grow w-full h-full bg-slate-200"></div>
            </div>

        </section>

        <!-- ESPACIO ADSENSE INFERIOR -->
        <div class="w-full bg-slate-200 text-slate-400 text-sm py-4 flex justify-center items-center rounded border border-dashed border-slate-300">
            [AdSense Bottom Banner]
        </div>

    </main>

    <!-- PIE DE PÁGINA (Hecho en Costa Rica) -->
    <footer class="bg-slate-900 text-slate-400 py-8 text-center text-xs mt-auto">
        <div class="max-w-4xl mx-auto px-4 flex flex-col items-center space-y-4">
            <div class="flex items-center gap-2 bg-slate-800 px-4 py-2 rounded-full border border-slate-700 shadow-inner">
                <div class="w-5 h-5 rounded-full overflow-hidden flex flex-col border border-slate-600 flex-shrink-0">
                    <div class="bg-[#002B7F] h-[16.6%]"></div><div class="bg-white h-[16.6%]"></div>
                    <div class="bg-[#CE1126] h-[33.2%]"></div>
                    <div class="bg-white h-[16.6%]"></div><div class="bg-[#002B7F] h-[17%]"></div>
                </div>
                <span class="text-slate-300 font-medium tracking-wide">Made in Costa Rica with love</span>
            </div>
            <p class="mt-4">&copy; 2026 KML Studio. <span id="t-rights">All rights reserved.</span></p>
        </div>
    </footer>

    <div id="toastContainer" class="fixed bottom-4 left-4 right-4 flex flex-col items-center gap-2 pointer-events-none z-50"></div>

    <!-- Librerías Externas -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        // --- 1. DICCIONARIO DE IDIOMAS ---
        const i18n = {
            en: {
                "seo-title": "KML Studio - Create & View routes",
                "t-logo": "KML Studio",
                "t-slogan": "Generate & Preview KML/KMZ",
                "t-label-code": "Paste your KML code here:",
                "t-label-name": "File name:",
                "t-btn-preview": "Preview on Map",
                "t-map-title": "Interactive Map Preview",
                "t-rights": "All rights reserved.",
                "msg-empty": "Text area is empty. Paste KML code first.",
                "msg-downloading": "Downloading: ",
                "msg-error": "There was an error generating the file.",
                "msg-nomap": "Could not find valid coordinates to draw."
            },
            es: {
                "seo-title": "KML Studio - Generador y Visor de rutas",
                "t-logo": "KML Studio",
                "t-slogan": "Genera y Visualiza KML/KMZ",
                "t-label-code": "Pega tu código KML aquí:",
                "t-label-name": "Nombre del archivo:",
                "t-btn-preview": "Previsualizar en Mapa",
                "t-map-title": "Visor de Mapa Interactivo",
                "t-rights": "Todos los derechos reservados.",
                "msg-empty": "El área de texto está vacía. Pega el código primero.",
                "msg-downloading": "Descargando: ",
                "msg-error": "Hubo un error al generar el archivo.",
                "msg-nomap": "No se encontraron coordenadas válidas para dibujar."
            },
            pt: {
                "seo-title": "KML Studio - Crie e Visualize rotas",
                "t-logo": "KML Studio",
                "t-slogan": "Gerar e Visualizar KML/KMZ",
                "t-label-code": "Cole seu código KML aqui:",
                "t-label-name": "Nome do arquivo:",
                "t-btn-preview": "Pré-visualizar no Mapa",
                "t-map-title": "Visualização Interativa do Mapa",
                "t-rights": "Todos os direitos reservados.",
                "msg-empty": "A área de texto está vazia. Cole o código primeiro.",
                "msg-downloading": "Baixando: ",
                "msg-error": "Ocorreu um erro ao gerar o arquivo.",
                "msg-nomap": "Não foram encontradas coordenadas válidas."
            }
        };

        let currentLang = 'en';

        function changeLanguage(lang) {
            currentLang = lang;
            document.getElementById('html-tag').lang = lang;
            for (const key in i18n[lang]) {
                const element = document.getElementById(key);
                if (element) {
                    if (element.tagName === 'META' || element.tagName === 'TITLE') {
                        element.content = i18n[lang][key];
                        if(element.tagName === 'TITLE') element.innerText = i18n[lang][key];
                    } else {
                        element.innerHTML = i18n[lang][key];
                    }
                }
            }
        }

        // --- 2. INICIALIZACIÓN DEL MAPA (LEAFLET) ---
        let map;
        let rutaLayer;

        window.onload = () => {
            // Configurar Idioma por defecto
            const userLang = navigator.language || navigator.userLanguage;
            const langCode = userLang.split('-')[0];
            if(i18n[langCode]) {
                document.getElementById('lang-selector').value = langCode;
                changeLanguage(langCode);
            }

            // Iniciar Mapa centrado globalmente (O puedes poner coordenadas de Costa Rica: [9.928, -84.090])
            map = L.map('map').setView([9.928, -84.090], 7);
            
            // Cargar capa de calles de OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
        };

        // --- 3. FUNCIÓN DE PREVISUALIZACIÓN EN MAPA ---
        function previewOnMap() {
            const kmlContent = document.getElementById('kmlInput').value.trim();
            if (!kmlContent) {
                mostrarToast(i18n[currentLang]['msg-empty'], 'error');
                return;
            }

            // Limpiar ruta anterior si existe
            if (rutaLayer) { map.removeLayer(rutaLayer); }

            try {
                // Analizador básico de XML para extraer coordenadas
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(kmlContent, "text/xml");
                const coordsNodes = xmlDoc.getElementsByTagName("coordinates");
                
                let allLatLngs = [];
                
                // Recorrer todos los nodos de coordenadas y extraer puntos
                for(let i=0; i<coordsNodes.length; i++) {
                    const text = coordsNodes[i].textContent.trim();
                    const points = text.split(/\s+/);
                    const latLngs = [];
                    
                    points.forEach(p => {
                        const parts = p.split(',');
                        if(parts.length >= 2) {
                            const lng = parseFloat(parts[0]);
                            const lat = parseFloat(parts[1]);
                            if(!isNaN(lat) && !isNaN(lng)) {
                                latLngs.push([lat, lng]);
                                allLatLngs.push([lat, lng]);
                            }
                        }
                    });

                    if(latLngs.length > 0) {
                        // Dibujar línea roja en el mapa
                        rutaLayer = L.polyline(latLngs, {color: 'red', weight: 5}).addTo(map);
                    }
                }

                if(allLatLngs.length > 0) {
                    // Ajustar la cámara del mapa para que se vea toda la ruta
                    map.fitBounds(L.latLngBounds(allLatLngs));
                    mostrarToast("Ruta trazada en el mapa", "success");
                } else {
                    mostrarToast(i18n[currentLang]['msg-nomap'], 'error');
                }

            } catch (e) {
                console.error(e);
                mostrarToast(i18n[currentLang]['msg-error'], 'error');
            }
        }

        // --- 4. FUNCIÓN DE GENERACIÓN (KML y KMZ) ---
        async function generarArchivo(tipo) {
            const kmlContent = document.getElementById('kmlInput').value.trim();
            let fileName = document.getElementById('fileName').value.trim() || 'MyRoute';

            if (!kmlContent) {
                mostrarToast(i18n[currentLang]['msg-empty'], 'error');
                return;
            }

            try {
                let finalBlob;
                let finalName = fileName;

                if (tipo === 'kmz') {
                    // Lógica para KMZ usando JSZip
                    if (!finalName.toLowerCase().endsWith('.kmz')) finalName += '.kmz';
                    
                    mostrarToast("Comprimiendo a KMZ...", "success");
                    const zip = new JSZip();
                    zip.file("doc.kml", kmlContent); // El KML debe ir dentro del zip con este nombre
                    finalBlob = await zip.generateAsync({type:"blob"});
                    
                } else {
                    // Lógica normal para KML
                    if (!finalName.toLowerCase().endsWith('.kml')) finalName += '.kml';
                    finalBlob = new Blob([kmlContent], { type: 'application/vnd.google-earth.kml+xml' });
                }

                // Descarga
                const url = URL.createObjectURL(finalBlob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = finalName;
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);

                mostrarToast(i18n[currentLang]['msg-downloading'] + finalName, 'success');

                // --- TRACKING PARA GOOGLE ANALYTICS ---
                if (typeof gtag === 'function') {
                    gtag('event', 'file_generated', {
                        'file_type': tipo,
                        'file_name': finalName
                    });
                }

            } catch (error) {
                mostrarToast(i18n[currentLang]['msg-error'], 'error');
            }
        }

        // --- NOTIFICACIONES ---
        function mostrarToast(mensaje, tipo = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgColor = tipo === 'error' ? 'bg-red-600' : 'bg-green-600';
            const icon = tipo === 'error' 
                ? '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>'
                : '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';

            toast.className = `${bgColor} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 toast-enter font-bold text-sm w-full max-w-sm`;
            toast.innerHTML = `${icon} <span>${mensaje}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(20px)';
                toast.style.transition = 'all 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
